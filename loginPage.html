<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Psychological Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FFDEE9, #B5FFFC);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
            text-align: center;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        .login-container p {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #4286f4;
            box-shadow: 0 0 8px rgba(66, 134, 244, 0.5);
        }

        .input-group i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #4286f4, #6fb1fc);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s ease-in-out;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #357ae8, #5fa8f9);
        }

        #trial {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #f1f1f1;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }

        #trial:hover {
            background: #e0e0e0;
        }

        .social-icons {
            margin-top: 20px;
        }

        .social-icons i {
            font-size: 24px;
            margin: 0 10px;
            color: #4286f4;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .social-icons i:hover {
            transform: scale(1.2);
        }

        /* 响应式优化 */
        @media (max-width: 768px) {
            .login-container {
                width: 90%;
                padding: 20px;
            }

            .login-btn,
            #trial {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Welcome to PSYNAV 🌸</h2>
        <p>Log in to explore a personalized emotional support experience.</p>
        <div class="input-group">
            <input type="text" placeholder="Username" required>
            <i class="fas fa-user"></i>
        </div>
        <div class="input-group">
            <input type="password" placeholder="Password" required>
            <i class="fas fa-lock"></i>
        </div>
        <button class="login-btn">Log in</button>
        <button id="trial">Try AI Trial 🌟</button>


    </div>

    <script>
        document.getElementById('trial').addEventListener('click', function () {
            window.location.href = 'diagnosePage.html';
        });
    </script>
</body>

</html>
